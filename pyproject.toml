[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-cmdb"
version = "0.4.0"
description = "Homelab CMDB Ansible-fed, SQLite-backed inventory"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    # First-party code imports it directly -- anyio.Lock() in cmdb/mcp/auth.py and
    # to_thread.run_sync() in cmdb/mcp/server.py -- so it is a real dependency, not
    # just the transitive one starlette/mcp happen to pull in.
    "anyio>=4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1",
    # Signs the session cookie, via Starlette's SessionMiddleware. Base rather
    # than optional: CMDB_AUTH_MODE defaults to `local`, so a fresh clone needs
    # it to serve its own login page.
    "itsdangerous>=2.2",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/osaljehani/homelab-cmdb"
Repository = "https://github.com/osaljehani/homelab-cmdb"
Issues = "https://github.com/osaljehani/homelab-cmdb/issues"
Changelog = "https://github.com/osaljehani/homelab-cmdb/blob/master/CHANGELOG.md"

[project.scripts]
cmdb = "cmdb.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
# Optional: enables `cmdb collect` (agentless collection over SSH).
collect = [
    # Pinned <2.21: the paramiko connection plugin (the only binary-free general
    # SSH transport) was removed in ansible-core 2.21, and the distroless runtime
    # ships no openssh-client binary. 2.20 still supports a 3.13 controller.
    "ansible-core>=2.16,<2.21",
    # paramiko drives that pure-Python SSH connection (transport=paramiko) so the
    # image needs no openssh-client — see Dockerfile.
    "paramiko>=3.5",
]
# Optional: enables `cmdb mcp` (MCP over stdio) AND the remote streamable-HTTP
# endpoint served by `cmdb serve` when CMDB_MCP_REMOTE_ENABLED is set.
mcp = [
    # >=1.28: the remote endpoint relies on AuthSettings.resource_server_url and
    # the RFC 9728 path-inserted metadata route, neither of which 1.12 has.
    "mcp>=1.28,<2",
    # Both are already resolved transitively via mcp, but cmdb/mcp/auth.py
    # imports them directly -- and depending on a transitive pin for signature
    # verification is exactly the kind of fragility that goes unnoticed until an
    # mcp release drops it and the next `uv lock` silently breaks the verifier.
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
]
# Optional: enables CMDB_AUTH_MODE=oidc (authorization code + PKCE against any
# OIDC provider). Local password login and proxy-header auth need none of this,
# which is why it is not a base dependency -- but the runtime image installs it,
# so that turning the mode on cannot fail at import time. cmdb/config.py checks
# for these at construction and names this group if they are missing.
oidc = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# *-example.py are illustrative scrubbed copies of the gitignored real tests; not collected.
addopts = "--ignore-glob=*-example.py"

[tool.hatch.build.targets.wheel]
packages = ["cmdb"]
